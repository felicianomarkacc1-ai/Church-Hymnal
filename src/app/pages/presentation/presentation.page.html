<ion-content
  class="presentation-content"
  (touchstart)="onSwipe($event)"
  (touchend)="onSwipe($event)"
>
  <div class="presentation-area" (click)="onStageTap($event)">
    <div class="presentation-shell">
      <div class="presentation-landscape" aria-hidden="true">
        <span class="landscape-sun"></span>
        <span class="landscape-hill landscape-hill-back"></span>
        <span class="landscape-hill landscape-hill-front"></span>
        <span class="landscape-water"></span>
        <span class="landscape-note landscape-note-one">♪</span>
        <span class="landscape-note landscape-note-two">♫</span>
      </div>
      <ion-button
        fill="clear"
        color="light"
        class="presentation-back-btn"
        (click)="exitPresentation()"
        aria-label="Back to library"
      >
        <ion-icon slot="icon-only" name="arrow-back"></ion-icon>
      </ion-button>

      <ion-button
        *ngIf="fullscreenSupported"
        fill="clear"
        color="light"
        class="presentation-maximize-btn"
        (click)="toggleFullscreen()"
        aria-label="Toggle fullscreen"
      >
        <ion-icon slot="icon-only" [name]="isFullscreen ? 'contract-outline' : 'expand-outline'"></ion-icon>
      </ion-button>

      <header class="presentation-header">
        <div class="presentation-bar">
          <div class="presentation-title-wrap">
            <span class="presentation-title">{{ hymn?.title || 'Untitled hymn' }}</span>
          </div>
        </div>

        <div class="section-row">
          <span class="section-label">{{ getSectionLabel() }}</span>

          <div class="font-controls-compact">
            <ion-button
              fill="clear"
              color="light"
              class="font-side-btn"
              (click)="decreaseFontSize()"
              aria-label="Decrease text size"
            >
              <ion-icon slot="icon-only" name="remove-outline"></ion-icon>
            </ion-button>
            <span class="font-controls-value">{{ fontSize }}</span>
            <ion-button
              fill="clear"
              color="light"
              class="font-side-btn"
              (click)="increaseFontSize()"
              aria-label="Increase text size"
            >
              <ion-icon slot="icon-only" name="add-outline"></ion-icon>
            </ion-button>
          </div>
        </div>
      </header>

      <main class="presentation-main" [ngClass]="getFontSizeClass()">
        <div class="lyrics-text">
          {{ getCurrentSection()?.text || 'No lyrics available yet.' }}
        </div>
      </main>

      <footer class="presentation-footer">
        <div class="control-group">
          <ion-button
            fill="clear"
            color="light"
            class="nav-btn"
            (click)="previousSection()"
            [disabled]="currentSectionIndex === 0"
            aria-label="Previous section"
          >
            <ion-icon name="chevron-back"></ion-icon>
          </ion-button>
          <span class="slide-counter">{{ currentSectionIndex + 1 }} / {{ hymn?.sections?.length ?? 0 }}</span>
          <ion-button
            fill="clear"
            color="light"
            class="nav-btn"
            (click)="nextSection()"
            [disabled]="!hymn || currentSectionIndex >= hymn.sections.length - 1"
            aria-label="Next section"
          >
            <ion-icon name="chevron-forward"></ion-icon>
          </ion-button>
        </div>

        <div class="quick-jump" *ngIf="quickJumpLabels.length > 0">
          <button
            *ngFor="let label of quickJumpLabels"
            class="quick-jump-chip"
            [class.quick-jump-chip-active]="getSectionLabel() === label"
            (click)="jumpToLabel(label)"
          >
            {{ label }}
          </button>
        </div>
      </footer>
    </div>
  </div>
</ion-content>
